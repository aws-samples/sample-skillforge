<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Skillforge social preview</title>
  <desc id="description">Skillforge builds persona-aware agent skill packs from one repository for Claude Code, Codex, Kiro, and Amazon Quick.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09152D"/>
      <stop offset="0.58" stop-color="#172B4D"/>
      <stop offset="1" stop-color="#213E69"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3578E5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3578E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0F9D8A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0F9D8A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020817" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172B4D" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#94A3B8"/>
    </marker>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="120" cy="55" r="270" fill="url(#blueGlow)"/>
  <circle cx="1170" cy="565" r="310" fill="url(#tealGlow)"/>
  <path d="M0 548C205 473 310 570 503 518C690 468 792 356 1010 420C1125 454 1202 454 1280 424V640H0Z" fill="#FFFFFF" opacity="0.025"/>

  <g class="font">
    <g transform="translate(66 56)">
      <path d="M24 0L48 14V42L24 56L0 42V14Z" fill="#3578E5"/>
      <path d="M14 18H34L39 28L34 38H14L9 28Z" fill="#FFFFFF"/>
      <circle cx="24" cy="28" r="5" fill="#3578E5"/>
    </g>
    <text x="132" y="94" font-size="38" font-weight="780" fill="#FFFFFF" letter-spacing="-0.8">Skillforge</text>
    <rect x="66" y="126" width="212" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="86" cy="142" r="5" fill="#5EEAD4"/>
    <text x="101" y="147" font-size="12" font-weight="750" letter-spacing="1.2" fill="#DCE8F9">PORTABLE AGENT SKILLS</text>

    <text x="66" y="240" font-size="54" font-weight="780" fill="#FFFFFF" letter-spacing="-1.2">Build agent skills once.</text>
    <text x="66" y="307" font-size="54" font-weight="780" fill="#FFFFFF" letter-spacing="-1.2">Ship them everywhere.</text>
    <text x="68" y="356" font-size="20" fill="#C6D5E9">One repository for skills, personas, policy constraints,</text>
    <text x="68" y="386" font-size="20" fill="#C6D5E9">vertical add-ons, and host-native agents.</text>

    <rect x="66" y="432" width="365" height="48" rx="24" fill="#0F9D8A"/>
    <circle cx="94" cy="456" r="6" fill="#BFF7EE"/>
    <text x="113" y="463" font-size="14" font-weight="780" letter-spacing="0.7" fill="#FFFFFF">PERSONAS SWAP  ·  VERTICALS ADD</text>

    <text x="68" y="548" font-size="14" font-weight="700" letter-spacing="1" fill="#8FA6C2">VALIDATE  ·  EVAL  ·  MUTATE  ·  TEST</text>
    <text x="68" y="583" font-size="14" fill="#9FB2CA">Apache-2.0 open-source sample</text>

    <g filter="url(#shadow)">
      <rect x="748" y="58" width="466" height="524" rx="30" fill="#F8FAFC"/>
    </g>
    <text x="786" y="103" font-size="13" font-weight="780" letter-spacing="1.4" fill="#64748B">ONE SOURCE</text>
    <text x="1176" y="103" text-anchor="end" font-size="13" font-weight="780" letter-spacing="1.4" fill="#64748B">FOUR HOSTS</text>
    <path d="M900 98H1025" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#softShadow)">
      <rect x="786" y="132" width="172" height="68" rx="16" fill="#EEF4FF" stroke="#8CB5FF" stroke-width="1.5"/>
      <rect x="1004" y="132" width="172" height="68" rx="16" fill="#FFF7E6" stroke="#F4BE58" stroke-width="1.5"/>
    </g>
    <circle cx="813" cy="166" r="13" fill="#3578E5"/>
    <circle cx="813" cy="162" r="4.5" fill="#FFFFFF"/>
    <path d="M805 174Q813 166 821 174" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="836" y="161" font-size="15" font-weight="750" fill="#172B4D">Persona pack</text>
    <text x="836" y="181" font-size="12" fill="#64748B">Choose exactly one</text>

    <circle cx="1031" cy="166" r="13" fill="#E39512"/>
    <path d="M1025 166H1037M1031 160V172" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="1054" y="161" font-size="15" font-weight="750" fill="#172B4D">Verticals</text>
    <text x="1054" y="181" font-size="12" fill="#64748B">Add zero or more</text>

    <circle cx="981" cy="166" r="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="981" y="173" text-anchor="middle" font-size="24" font-weight="650" fill="#94A3B8">+</text>

    <path d="M872 200V230H981" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M1090 200V230H981" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M981 230V242" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#softShadow)">
      <rect x="838" y="250" width="286" height="88" rx="20" fill="#172B4D"/>
    </g>
    <path d="M879 266L902 279.5V306.5L879 320L856 306.5V279.5Z" fill="#3578E5"/>
    <path d="M869 284H889L893 293L889 302H869L865 293Z" fill="#FFFFFF"/>
    <circle cx="879" cy="293" r="4.5" fill="#3578E5"/>
    <text x="918" y="286" font-size="19" font-weight="780" fill="#FFFFFF">Skillforge build</text>
    <text x="918" y="311" font-size="13" fill="#C9D7EA">Resolve · inject · package · verify</text>

    <path d="M981 338V369" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#softShadow)">
      <rect x="786" y="383" width="183" height="66" rx="15" fill="#F0EBFF" stroke="#B6A5FF"/>
      <rect x="993" y="383" width="183" height="66" rx="15" fill="#EEF4FF" stroke="#8CB5FF"/>
      <rect x="786" y="466" width="183" height="66" rx="15" fill="#E7F9F6" stroke="#70D7C9"/>
      <rect x="993" y="466" width="183" height="66" rx="15" fill="#FFF0ED" stroke="#F0A59B"/>
    </g>
    <circle cx="812" cy="416" r="8" fill="#7A5AF8"/>
    <text x="830" y="422" font-size="15" font-weight="750" fill="#4D36B0">Claude Code</text>
    <circle cx="1019" cy="416" r="8" fill="#3578E5"/>
    <text x="1037" y="422" font-size="15" font-weight="750" fill="#2459B3">Codex</text>
    <circle cx="812" cy="499" r="8" fill="#0F9D8A"/>
    <text x="830" y="505" font-size="15" font-weight="750" fill="#087A6B">Kiro</text>
    <circle cx="1019" cy="499" r="8" fill="#E05A47"/>
    <text x="1037" y="505" font-size="15" font-weight="750" fill="#963B2F">Amazon Quick</text>

    <rect x="786" y="550" width="390" height="1" fill="#D7E0EB"/>
    <text x="981" y="572" text-anchor="middle" class="mono" font-size="11" fill="#64748B">skills/  personas/  verticals/  agents/  dist/</text>
  </g>
</svg>
